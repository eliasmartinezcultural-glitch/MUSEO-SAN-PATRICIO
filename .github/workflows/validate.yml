name: Museo 3.20 · Integridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar datos museográficos
        run: node tools/validate-museum.mjs
      - name: Validar sintaxis JavaScript
        run: node --check assets/js/museum-core.js
